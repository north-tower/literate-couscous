<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Sendline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="auth-page">
  <div class="noise" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <main class="stage admin-stage">
    <header class="brand">
      <div class="brand-copy">
        <p class="brand-mark">Sendline</p>
        <p class="brand-line">Invite operators. Chrome stays one campaign at a time.</p>
      </div>
      <div class="brand-user">
        <a class="text-btn" href="/">Campaign</a>
        <button type="button" class="text-btn" id="logoutBtn">Log out</button>
      </div>
    </header>

    <section class="admin-grid">
      <div class="card">
        <div class="field-head">
          <span class="field-label">Chrome queue</span>
          <span class="meta tip" id="queueMeta">idle</span>
        </div>
        <p class="field-hint" id="queueDetail">No campaign is using Chrome.</p>
        <ul class="queue-list" id="queueList"></ul>
      </div>

      <div class="card">
        <div class="field-head">
          <span class="field-label">Create user</span>
          <span class="meta tip">invite-only</span>
        </div>
        <form class="admin-form" id="createForm">
          <div class="field compact">
            <label class="input-label" for="newEmail">Email</label>
            <input id="newEmail" type="email" autocomplete="off" required />
          </div>
          <div class="field compact">
            <label class="input-label" for="newPassword">Temporary password</label>
            <input id="newPassword" type="text" autocomplete="off" minlength="8" required />
          </div>
          <div class="field compact">
            <label class="input-label" for="newRole">Role</label>
            <select id="newRole">
              <option value="operator" selected>Operator</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button type="submit" class="btn primary" id="createBtn">Create account</button>
        </form>
        <p class="status" id="status" role="status"></p>
      </div>

      <div class="card admin-users-card">
        <div class="field-head">
          <span class="field-label">Users</span>
          <span class="meta tip">no LinkedIn passwords</span>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/admin.js"></script>
</body>
</html>
